<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>曜日羽球團 - 星際補給母艦 v5.0</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. 核心變數 & 星際主題 --- */
        :root {
            --bg-deep: #050b14; /* 深邃宇宙黑 */
            --bg-card: rgba(15, 23, 42, 0.7); /* 半透明玻璃 */
            --bg-input: rgba(51, 65, 85, 0.6);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #00f3ff; /* 霓虹青 */
            --accent-glow: rgba(0, 243, 255, 0.4);
            --border: rgba(148, 163, 184, 0.2);
            --d-1: #a855f7; --d-2: #ef4444; --d-3: #3b82f6; --d-4: #22c55e;
            --d-5: #f59e0b; --d-6: #f97316; --d-0: #eab308; --d-temp: #94a3b8;
            --neon-red: #ff1744; --st-green-text: #34d399; --st-red-text: #f87171;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; /* 預設字體 */
            background-color: var(--bg-deep); 
            color: var(--text-primary);
            margin: 0; padding: 10px; padding-bottom: 140px; 
            overflow-x: hidden; /* 防止星星超出 */
            min-height: 100vh;
        }

        /* --- 2. 動態星空背景 (Starfield) --- */
        #starfield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: var(--opacity);
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* --- 3. 登入介面 (全像投影風格) --- */
        #authOverlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 11, 20, 0.95); /* 深色遮罩 */
            z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s;
        }
        .login-card {
            background: rgba(16, 30, 50, 0.6); /* 玻璃質感 */
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 40px 30px; border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3); /* 青色邊框 */
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.05);
            text-align: center; max-width: 340px; width: 85%;
            position: relative;
            overflow: hidden;
        }
        /* 掃描線裝飾 */
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scan 3s linear infinite; opacity: 0.5;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .sys-title { font-family: 'Orbitron', sans-serif; font-weight: 700; color: var(--accent); font-size: 1.2rem; letter-spacing: 2px; text-shadow: 0 0 10px var(--accent-glow); margin-bottom: 5px; }
        .sys-subtitle { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 4px; margin-bottom: 30px; text-transform: uppercase; }
        
        .btn-google {
            background: rgba(255, 255, 255, 0.95); color: #0f172a; font-weight: 700; border: none;
            padding: 14px 24px; border-radius: 4px; font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
            transition: all 0.3s;
            border: 1px solid var(--accent);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            font-family: 'Noto Sans TC', sans-serif;
        }
        .btn-google:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 243, 255, 0.6); }
        .btn-google:active { transform: scale(0.98); }

        /* --- 4. 頂部標題列 (戰艦風格) --- */
        .header-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; margin-bottom: 20px; padding-top: 15px;
        }
        h1 { 
            text-align: center; font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: white; 
            margin: 0; padding-top: 40px; text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        h1 span { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }
        .version-tag { font-size: 0.7rem; color: var(--text-secondary); vertical-align: super; opacity: 0.7; }

        /* 使用者資訊列 (HUD 風格) */
        .user-info { 
            position: absolute; top: 0; right: 0;
            font-size: 0.8rem; color: var(--accent); font-family: 'Orbitron', sans-serif;
            display: flex; align-items: center; gap: 8px; cursor: pointer; z-index: 100;
            background: rgba(0, 20, 40, 0.6); padding: 4px 10px 4px 4px; 
            border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 30px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }

        @media (min-width: 768px) {
            .header-container { flex-direction: row; justify-content: space-between; align-items: center; padding-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 25px; }
            h1 { padding-top: 0; text-align: left; font-size: 1.8rem; }
            .user-info { position: static; background: rgba(0,0,0,0.3); padding: 6px 16px 6px 6px; }
            .user-avatar { width: 36px; height: 36px; }
        }

        /* --- 5. 儀表板 & 元件 (沿用但微調顏色) --- */
        .dashboard-container { display: flex; flex-direction: column; gap: 15px; max-width: 1200px; margin: 0 auto; }
        
        @media (min-width: 768px) {
            .dashboard-container { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "venue ball" "history history"; align-items: start; gap: 24px; max-width: 960px; }
            .area-venue { grid-area: venue; } .area-ball { grid-area: ball; } .area-history { grid-area: history; }
            .summary-bar { width: auto !important; min-width: 640px; padding: 10px 25px !important; left: 50% !important; bottom: 40px !important; transform: translateX(-50%); border-radius: 12px !important; background: rgba(5, 11, 20, 0.9) !important; border: 1px solid rgba(0, 243, 255, 0.2) !important; box-shadow: 0 0 30px rgba(0, 243, 255, 0.1); }
            /* 電腦版表格優化 */
            table th:nth-child(1) { width: 80px !important; } table th:nth-child(2) { width: auto !important; } table th:nth-child(3) { width: 22% !important; } table th:nth-child(4) { width: 15% !important; } table th:nth-child(5) { width: 50px !important; }
        }

        .card { background: var(--bg-card); border-radius: 8px; padding: 15px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        h2 { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; margin: 0 0 12px 0; color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 8px; letter-spacing: 1px; }
        
        input { transition: 0.3s; border-radius: 4px; background: rgba(0,0,0,0.3) !important; border: 1px solid var(--border); color: white !important; font-family: 'Orbitron', sans-serif; } 
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); outline: none; }
        
        input[type="date"] { width: 100%; max-width: 260px; padding: 10px; font-size: 1rem; font-weight: bold; display: block; margin: 0 auto; text-align: center; border-radius: 30px; letter-spacing: 1px; }

        .venue-grid, .ball-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .venue-btn, .ball-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 12px 4px; border-radius: 6px; cursor: pointer; text-align: center; color: var(--text-secondary); transition: all 0.2s; position: relative; overflow: hidden; }
        .venue-btn { border-left-width: 3px; }
        .venue-btn strong { display: block; font-size: 0.95rem; margin-bottom: 3px; color: var(--text-primary); }
        .venue-btn span { font-size: 0.7rem; opacity: 0.7; }
        .venue-btn.active { background: rgba(0, 243, 255, 0.1); border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); } .venue-btn.active strong { color: var(--accent); }
        .ball-btn.active { background: rgba(0, 243, 255, 0.1); color: var(--accent); border-color: var(--accent); }
        .ball-del-btn { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; background: var(--neon-red); color: white; border-radius: 50%; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; z-index: 2; border: 2px solid var(--bg-card); }

        /* 場地顏色邊框 */
        .day-1 { border-left-color: var(--d-1); } .day-1.active { border-color: var(--d-1); color: var(--d-1); box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }
        .day-2 { border-left-color: var(--d-2); } .day-2.active { border-color: var(--d-2); color: var(--d-2); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        .day-3 { border-left-color: var(--d-3); } .day-3.active { border-color: var(--d-3); color: var(--d-3); box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
        .day-4 { border-left-color: var(--d-4); } .day-4.active { border-color: var(--d-4); color: var(--d-4); box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
        .day-5 { border-left-color: var(--d-5); } .day-5.active { border-color: var(--d-5); color: var(--d-5); box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
        .day-6 { border-left-color: var(--d-6); } .day-6.active { border-color: var(--d-6); color: var(--d-6); box-shadow: 0 0 10px rgba(249, 115, 22, 0.2); }
        .day-0 { border-left-color: var(--d-0); } .day-0.active { border-color: var(--d-0); color: var(--d-0); box-shadow: 0 0 10px rgba(234, 179, 8, 0.2); }
        .day-temp { border-left-color: var(--d-temp); }

        #venueAdjustPanel, #addVenueForm { margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid var(--border); display: none; }
        #addVenueForm { background: var(--bg-input); }
        .adjust-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .adjust-title { font-weight: bold; color: var(--accent); font-size: 1rem; }
        .btn-toggle-edit { background: transparent; border: 1px solid var(--text-secondary); color: var(--text-secondary); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        .btn-toggle-edit.active { background: var(--bg-input); color: var(--accent); border-color: var(--accent); }
        #adjustContent { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
        .adjust-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9rem; }
        .stepper-group { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.2); padding: 3px; border-radius: 4px; border: 1px solid var(--border); }
        .step-btn { width: 32px; height: 32px; background: rgba(255,255,255,0.05); border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 1.1rem; }
        .step-btn:active { background: var(--accent); color: var(--bg-deep); }
        .step-val { width: 50px; text-align: center; font-size: 1rem; font-weight: bold; font-family: 'Orbitron', monospace; color: var(--accent); }
        
        .stock-panel { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .stock-row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; background: rgba(255,255,255,0.03); }
        .stock-row.main { background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2); } 
        .stock-label-multi { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; font-size: 0.8rem; color: var(--text-secondary); text-align: right; padding-right: 4px; font-weight: bold; line-height: 1.1; }
        .stock-label { font-size: 0.8rem; color: var(--text-secondary); text-align: right; padding-right: 4px; font-weight: bold; }
        .num-control { display: flex; align-items: center; gap: 4px; width: 100%; }
        .num-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 4px; color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num-btn:active { background: var(--accent); color: var(--bg-deep); }
        .num-input { flex: 1; height: 36px; background: transparent; border: none; text-align: center; color: white; font-size: 1.2rem; font-family: 'Orbitron', monospace; font-weight: bold; width: 40px; outline: none; }
        
        .save-actions { display: flex; gap: 8px; margin-top: 15px; }
        .btn-save { flex: 2; padding: 14px; background: var(--accent); color: #050b14; border: none; border-radius: 6px; font-size: 1rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); transition: 0.2s; font-family: 'Noto Sans TC', sans-serif; }
        .btn-save:active { transform: scale(0.98); box-shadow: 0 0 5px rgba(0, 243, 255, 0.4); }
        .btn-copy { flex: 1; padding: 14px; background: transparent; color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        
        .guest-mode .btn-save, .guest-mode .btn-neon-danger, .guest-mode .ball-del-btn, .guest-mode .init-btn, .guest-mode .btn-toggle-edit, .guest-mode .edit-toggle { display: none !important; }

        .venue-group { margin-top: 20px; background: rgba(255,255,255,0.02); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); border-left-width: 4px; }
        .group-header { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); font-family: 'Orbitron', sans-serif; }
        .gh-title { font-size: 1rem; font-weight: 700; }
        /* 日期顏色群組 */
        .day-1 { border-left-color: var(--d-1); } .day-1 .gh-title { color: var(--d-1); } .day-2 { border-left-color: var(--d-2); } .day-2 .gh-title { color: var(--d-2); }
        .day-3 { border-left-color: var(--d-3); } .day-3 .gh-title { color: var(--d-3); } .day-4 { border-left-color: var(--d-4); } .day-4 .gh-title { color: var(--d-4); }
        .day-5 { border-left-color: var(--d-5); } .day-5 .gh-title { color: var(--d-5); } .day-6 { border-left-color: var(--d-6); } .day-6 .gh-title { color: var(--d-6); }
        .day-0 { border-left-color: var(--d-0); } .day-0 .gh-title { color: var(--d-0); } .day-temp { border-left-color: var(--d-temp); } .day-temp .gh-title { color: var(--d-temp); }

        .month-dashboard { display: flex; gap: 5px; padding: 8px 5px; overflow-x: auto; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); }
        .month-card { flex: 0 0 32%; max-width: 33%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 2px; border-top: 2px solid transparent; }
        .day-1 .month-card { border-top-color: var(--d-1); } .day-2 .month-card { border-top-color: var(--d-2); } .day-3 .month-card { border-top-color: var(--d-3); }
        .day-4 .month-card { border-top-color: var(--d-4); } .day-5 .month-card { border-top-color: var(--d-5); } .day-6 .month-card { border-top-color: var(--d-6); } .day-0 .month-card { border-top-color: var(--d-0); }
        
        .mc-header { font-size: 0.75rem; font-weight: bold; color: var(--text-primary); border-bottom: 1px dashed var(--border); padding-bottom: 3px; margin-bottom: 3px; text-align: center; }
        .mc-row { display: flex; justify-content: space-between; font-size: 0.65rem; } .mc-label { color: var(--text-secondary); } .mc-val { font-weight: bold; color: var(--text-primary); font-family: 'Orbitron', monospace; }
        .mc-stock-box { margin-top: 6px; padding: 4px; border-radius: 4px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; gap: 4px; }
        .mc-stock-label { writing-mode: vertical-rl; text-orientation: upright; font-size: 0.6rem; color: var(--text-secondary); letter-spacing: 2px; margin: 0; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 3px; }
        .mc-stock-num { font-size: 1.4rem; font-weight: 800; font-family: 'Orbitron', monospace; line-height: 1; position: relative; flex: 1; text-align: center; }
        .mc-stock-unit { font-size: 0.55rem; position: absolute; bottom: 0; right: -2px; opacity: 0.6; font-weight: normal; font-family: sans-serif; }
        .stock-safe { color: #4ade80; } .stock-warn { color: #facc15; } .stock-crit { color: #f87171; text-shadow: 0 0 5px rgba(248, 113, 113, 0.4); }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; table-layout: fixed; }
        th { text-align: center; padding: 8px 4px; color: var(--text-secondary); border-bottom: 1px solid var(--border); font-size: 0.7rem; font-weight: normal; }
        td { padding: 10px 4px; border-bottom: 1px solid var(--border); color: var(--text-primary); text-align: center; vertical-align: middle; }
        th:nth-child(1) { width: 50px; } th:nth-child(2) { width: auto; } th:nth-child(3) { width: 75px; } th:nth-child(4) { width: 50px; } th:nth-child(5) { width: 35px; }

        .badge-combined { padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; min-width: 60px; }
        .st-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .st-yellow { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .st-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
        .btn-del-row { background: transparent; color: #f87171; border: 1px solid #f87171; border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer; }

        .summary-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 11, 20, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: block; padding: 8px 5px; z-index: 999; }
        #brandBar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 5px; border-bottom: 1px dashed rgba(255,255,255,0.1); scrollbar-width: none; }
        #brandBar::-webkit-scrollbar { display: none; }
        .brand-tag { background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.3); color: var(--accent); font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; white-space: nowrap; font-weight: bold; flex-shrink: 0; display: flex; align-items: center; gap: 4px; font-family: 'Orbitron', sans-serif; }
        .brand-tag span { font-family: 'Orbitron', monospace; font-size: 0.8rem; color: white; }
        .cpch-alert { color: var(--neon-red) !important; text-shadow: 0 0 5px var(--neon-red-glow); } 
        .hud-row-main { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .hud-item { border-radius: 6px; padding: 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .hud-blue { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); } .hud-blue .val { color: #60a5fa; }
        .hud-orange { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); } .hud-orange .val { color: #fbbf24; }
        .hud-purple { background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.3); } .hud-purple .val { color: #c084fc; }
        .hud-teal { background: rgba(20, 184, 166, 0.1); border: 1px solid rgba(20, 184, 166, 0.3); } .hud-teal .val { color: #2dd4bf; }
        .label { font-size: 0.6rem; color: rgba(255,255,255,0.5); margin-bottom: 1px; letter-spacing: 1px; } .val { font-size: 0.85rem; font-weight: 800; font-family: 'Orbitron', monospace; }
        .action-bar { display: flex; gap: 10px; margin-top: 15px; }
        .btn-act { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text-secondary); cursor: pointer; font-weight: bold; }
        
        #loader { position: fixed; top:0; left:0; right:0; bottom:0; background: var(--bg-deep); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 2000; transition: opacity 0.5s; }
        .loader-text { margin-top: 15px; color: var(--accent); font-weight: bold; letter-spacing: 2px; font-family: 'Orbitron', sans-serif; animation: pulse 1.5s infinite; text-shadow: 0 0 10px var(--accent-glow); }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .init-btn { background: var(--d-3); color: white; padding: 12px; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; display: none; width: 100%; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div id="starfield"></div>

<div id="authOverlay">
    <div class="login-card">
        <div class="sys-title">曜日羽球｜戰情室</div>
        <div class="sys-subtitle">System Access Required</div>
        <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:25px;">請驗證艦長生物特徵以存取母艦資料庫</p>
        <button class="btn-google" onclick="signIn()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            [ 請求存取權限 ]
        </button>
    </div>
</div>

<div id="loader">
    <div style="font-size: 3rem; animation: spin 2s infinite linear;">🛸</div>
    <div class="loader-text">SYNCING MOTHER SHIP DATA...</div>
</div>

<div class="header-container">
    <h1>曜日羽球｜<span>星際補給母艦</span> <span class="version-tag">v5.0</span></h1>
    
    <div class="user-info" id="userInfo" onclick="logout()" style="display:none;">
        <span id="userName">艦長</span>
        <img id="userImg" class="user-avatar" src="">
    </div>
</div>

<div class="dashboard-container">

    <div class="card area-venue">
        <h2>
            1. 選擇或管理場地
            <span style="font-size:0.8rem; color:var(--accent); cursor:pointer;" onclick="toggleAddVenue()">＋新增場次</span>
        </h2>
        <input type="date" id="pickerDate" onchange="handleDateChange()">
        
        <button id="btnInitData" class="init-btn" onclick="initDefaultData()">⚡️ 初始化預設班表與球種 (僅一次)</button>

        <div id="dynamicVenueArea" class="venue-grid"></div>

        <div id="addVenueForm">
            <div style="display:flex; gap:15px; margin-bottom:10px; font-size:0.9rem;">
                <label><input type="radio" name="vType" value="temp" checked> 臨時加開</label>
                <label><input type="radio" name="vType" value="fixed"> 固定班表</label>
            </div>
            <input type="text" id="nvName" class="form-input" placeholder="場地名稱 (如: 外調比賽)">
            <div style="display:flex; gap:10px;">
                <input type="number" id="nvCourt" class="form-input" placeholder="面數" value="1">
                <input type="number" id="nvHr" class="form-input" placeholder="時數" value="2">
            </div>
            <button class="btn-save" style="margin-top:0; padding:10px; width:100%;" onclick="confirmAddVenue()">確定加入</button>
        </div>

        <div id="venueAdjustPanel">
            <div class="adjust-header">
                <span id="adjustTitle" class="adjust-title"></span>
                <button id="btnEditToggle" class="btn-toggle-edit" onclick="toggleEditPanel()">⚙️ 調整規格</button>
            </div>
            <div id="adjustContent">
                <div class="adjust-row"><span>面數</span><div class="stepper-group"><button class="step-btn" onclick="adjVenueParam('court', -1)">-</button><span id="dispCourt" class="step-val">0</span><button class="step-btn" onclick="adjVenueParam('court', 1)">+</button></div></div>
                <div class="adjust-row"><span>時數</span><div class="stepper-group"><button class="step-btn" onclick="adjVenueParam('hr', -0.5)">-</button><span id="dispHr" class="step-val">0</span><button class="step-btn" onclick="adjVenueParam('hr', 0.5)">+</button></div></div>
                <div style="text-align:right; font-size:0.85rem; color:var(--text-secondary); margin-top:5px;">總場時: <span id="dispTotalFH" style="color:var(--text-primary); font-weight:bold;">0</span></div>
                <div id="fixedVenueActions" class="manage-actions" style="display:none;">
                    <button class="btn-action btn-update" onclick="updateFixedVenue()">💾 更新預設</button>
                    <button class="btn-action btn-neon-danger" onclick="deleteFixedVenue()">🗑 移除班表</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card area-ball">
        <h2>
            2. 球種 & 彈藥庫
            <span class="edit-toggle" onclick="toggleBallEdit()">編輯模式</span>
        </h2>
        <div id="ballArea" class="ball-grid"></div>

        <div class="stock-panel">
            <div class="stock-row main">
                <div class="stock-label-multi"><span>🔥 本場</span><span>消耗</span></div>
                <div class="num-control">
                    <button class="num-btn" onclick="adjVal('inpCount', -1)">-</button>
                    <input type="number" id="inpCount" class="num-input" value="12">
                    <button class="num-btn" onclick="adjVal('inpCount', 1)">+</button>
                </div>
            </div>
            <div class="stock-row">
                <div class="stock-label" style="color:#4ade80;">➕ 補充 (桶)</div>
                <div class="num-control">
                    <button class="num-btn" onclick="adjVal('inpRestockTube', -1)">-</button>
                    <input type="number" id="inpRestockTube" class="num-input" value="0">
                    <button class="num-btn" onclick="adjVal('inpRestockTube', 1)">+</button>
                </div>
            </div>
            <div style="text-align:right; font-size:0.7rem; color:#64748b;">* 1 桶 = 12 顆</div>
        </div>
        
        <div class="save-actions">
            <button class="btn-copy" onclick="copyToClipboard()">📋 複製結算</button>
            <button class="btn-save" onclick="saveRecord()">📥 存入紀錄</button>
        </div>
    </div>

    <div class="card area-history">
        <h2>3. 歷史紀錄 (月度戰情)</h2>
        <div id="historyContainer"></div>
        <div class="action-bar">
            <button class="btn-act" onclick="exportData()" style="color:var(--st-green-text); border-color:var(--st-green-text);">匯出報表</button>
            <button class="btn-act btn-neon-danger" onclick="clearData()">☢️ 清空資料</button>
        </div>
    </div>

</div>

<div class="summary-bar">
    <div id="brandBar"></div>
    <div class="hud-row-main">
        <div class="hud-item hud-blue"><div class="label">總成本</div><div class="val" id="footCost">$0</div></div>
        <div class="hud-item hud-orange"><div class="label">總耗球</div><div class="val" id="footBall">0</div></div>
        <div class="hud-item hud-purple"><div class="label">CPCH</div><div class="val" id="footCPCH">0.0</div></div>
        <div class="hud-item hud-teal"><div class="label">$/HR</div><div class="val" id="footAvgCost">0</div></div>
    </div>
</div>

<script type="module">
    // ⚠️⚠️⚠️ 艦長請注意！請將您的 Gmail 填入下方陣列中 ⚠️⚠️⚠️
    const ADMIN_EMAILS = [
        'ives173@gmail.com',      // 阿定
        'zxcvasdf627@gmail.com',  // 小安
        'king230089@gmail.com',   // 阿樂
        'derlbyon@gmail.com',     // 阿寶
        'shine890527@gmail.com',  // 閃亮
        'j3933001@gmail.com',     // 節省
        'jimmy1313677@gmail.com', // 文文
        'songchiyu06@gmail.com'   // 小飛
    ]; 

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCol2fTV9wPfIuJThes5AivLDghIeFHwx8",
      authDomain: "starship-badminton.firebaseapp.com",
      projectId: "starship-badminton",
      storageBucket: "starship-badminton.firebasestorage.app",
      messagingSenderId: "727787756995",
      appId: "1:727787756995:web:383e8d0a2055164135f176"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let schedule = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
    let balls = [];
    let records = [];
    let currentVenue = null; 
    let selectedBall = null;
    let isBallEditMode = false;
    let isDbLoaded = { sched: false, ball: false, rec: false };
    let venueLastStock = {}; 

    // --- Starfield Animation Logic ---
    function initStarfield() {
        const layer = document.getElementById('starfield');
        const count = 50; 
        for(let i=0; i<count; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const s = Math.random() * 2 + 1; 
            star.style.width = s + 'px';
            star.style.height = s + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.setProperty('--opacity', Math.random());
            layer.appendChild(star);
        }
    }
    initStarfield();

    // --- Auth Logic ---
    window.signIn = () => {
        signInWithPopup(auth, provider).catch((error) => alert("存取被拒: " + error.message));
    };
    
    window.logout = () => {
        if(confirm("確定要登出星際母艦嗎？")) signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('authOverlay').style.opacity = 0;
            setTimeout(() => document.getElementById('authOverlay').style.display = 'none', 800);
            
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userImg').src = user.photoURL;
            
            // Check Admin Permissions
            if (ADMIN_EMAILS.includes(user.email)) {
                document.body.classList.remove('guest-mode');
                document.getElementById('userName').innerText = "艦長 (Admin)";
            } else {
                document.body.classList.add('guest-mode');
                document.getElementById('userName').innerText = "訪客 (唯讀)";
                if(!sessionStorage.getItem('guestAlertShown')) {
                    alert(`身分確認：${user.displayName}\n權限等級：訪客\n\n歡迎登艦，您目前僅能瀏覽戰情儀表板。`);
                    sessionStorage.setItem('guestAlertShown', 'true');
                }
            }
            
            // Start Loading Data
            if (!isDbLoaded.sched) startDataListeners();
            
        } else {
            currentUser = null;
            document.getElementById('authOverlay').style.display = 'flex';
            document.getElementById('authOverlay').style.opacity = 1;
            document.getElementById('userInfo').style.display = 'none';
        }
    });

    function checkLoader() {
        if(isDbLoaded.sched && isDbLoaded.ball && isDbLoaded.rec) {
            document.getElementById('loader').style.opacity = 0;
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500);
            let totalSched = Object.values(schedule).flat().length;
            if(document.body.classList.contains('guest-mode')) {
                document.getElementById('btnInitData').style.display = 'none';
            } else {
                document.getElementById('btnInitData').style.display = (totalSched === 0 && balls.length === 0) ? 'block' : 'none';
            }
        }
    }

    function startDataListeners() {
        onSnapshot(collection(db, "schedules"), (snapshot) => {
            schedule = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
            snapshot.forEach((doc) => {
                const d = doc.data();
                if(schedule[d.dayIndex]) schedule[d.dayIndex].push({ id: doc.id, ...d });
            });
            isDbLoaded.sched = true; checkLoader(); handleDateChange();
        });

        onSnapshot(query(collection(db, "balls"), orderBy("price")), (snapshot) => {
            balls = []; snapshot.forEach((doc) => balls.push({ id: doc.id, ...doc.data() }));
            isDbLoaded.ball = true; checkLoader(); renderBalls();
        });

        onSnapshot(query(collection(db, "records"), orderBy("date", "asc")), (snapshot) => { 
            records = []; snapshot.forEach((doc) => records.push({ id: doc.id, ...doc.data() }));
            records.sort((a,b) => new Date(a.date) - new Date(b.date)); 
            isDbLoaded.rec = true; checkLoader(); refreshUI();
        });
    }

    window.handleDateChange = handleDateChange;
    window.toggleAddVenue = toggleAddVenue;
    window.confirmAddVenue = confirmAddVenue;
    window.selectVenue = selectVenue;
    window.toggleEditPanel = toggleEditPanel;
    window.adjVenueParam = adjVenueParam;
    window.updateFixedVenue = updateFixedVenue;
    window.deleteFixedVenue = deleteFixedVenue;
    window.toggleBallEdit = toggleBallEdit;
    window.addNewBall = addNewBall;
    window.deleteBall = deleteBall;
    window.selectBall = selectBall;
    window.adjVal = adjVal;
    window.saveRecord = saveRecord;
    window.copyToClipboard = copyToClipboard;
    window.delRecord = delRecord;
    window.clearData = clearData;
    window.exportData = exportData;
    window.initDefaultData = initDefaultData;

    function handleDateChange() {
        const dateVal = document.getElementById('pickerDate').value;
        if (!dateVal) return;
        localStorage.setItem('yao_last_date', dateVal); 
        renderVenueGrid(new Date(dateVal).getDay());
    }

    function renderVenueGrid(dayIndex) {
        const container = document.getElementById('dynamicVenueArea'); container.innerHTML = '';
        currentVenue = null;
        document.getElementById('venueAdjustPanel').style.display = 'none';
        document.getElementById('addVenueForm').style.display = 'none';
        const venues = schedule[dayIndex] || [];
        if (venues.length > 0) {
            venues.forEach(v => {
                const btn = document.createElement('div');
                btn.className = `venue-btn day-${dayIndex}`;
                btn.innerHTML = `<strong>${v.name}</strong><span>${v.court}面 / ${v.hr}hr</span>`;
                btn.onclick = () => selectVenue(v, btn, dayIndex);
                container.appendChild(btn);
            });
        } else {
            container.innerHTML = `<div style="grid-column:span 2; text-align:center; color:var(--text-secondary); padding:10px;">本日無固定班表</div>`;
        }
    }

    function selectVenue(v, el, dayIndex) {
        currentVenue = { ...v, dayIndex: dayIndex }; 
        document.querySelectorAll('.venue-btn').forEach(b => b.classList.remove('active'));
        if(el) el.classList.add('active');
        document.getElementById('venueAdjustPanel').style.display = 'block';
        document.getElementById('adjustTitle').innerText = currentVenue.name;
        document.getElementById('fixedVenueActions').style.display = currentVenue.id ? 'flex' : 'none';
        document.getElementById('adjustContent').style.display = 'none';
        document.getElementById('btnEditToggle').classList.remove('active');
        updateStepperDisplay();
        document.getElementById('addVenueForm').style.display = 'none';
    }

    function toggleEditPanel() {
        const content = document.getElementById('adjustContent');
        const btn = document.getElementById('btnEditToggle');
        content.style.display = (content.style.display === 'none' || content.style.display === '') ? 'block' : 'none';
        content.style.display === 'block' ? btn.classList.add('active') : btn.classList.remove('active');
    }

    function adjVenueParam(type, delta) {
        if(!currentVenue) return;
        if(type === 'court') currentVenue.court = Math.max(1, currentVenue.court + delta);
        else if (type === 'hr') currentVenue.hr = Math.max(0.5, currentVenue.hr + delta);
        updateStepperDisplay();
    }

    function updateStepperDisplay() {
        if(!currentVenue) return;
        document.getElementById('dispCourt').innerText = currentVenue.court;
        document.getElementById('dispHr').innerText = currentVenue.hr;
        document.getElementById('dispTotalFH').innerText = (currentVenue.court * currentVenue.hr).toFixed(1);
    }

    function toggleAddVenue() {
        const form = document.getElementById('addVenueForm');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
        document.getElementById('venueAdjustPanel').style.display = 'none';
        document.querySelectorAll('.venue-btn').forEach(b => b.classList.remove('active'));
        currentVenue = null;
    }

    async function confirmAddVenue() {
        const name = document.getElementById('nvName').value;
        const court = parseFloat(document.getElementById('nvCourt').value);
        const hr = parseFloat(document.getElementById('nvHr').value);
        if(!name) return alert("請輸入名稱");
        const type = document.querySelector('input[name="vType"]:checked').value;
        if(type === 'fixed') {
            try {
                await addDoc(collection(db, "schedules"), { dayIndex: new Date(document.getElementById('pickerDate').value).getDay(), name, court, hr });
                alert("已同步至雲端班表"); document.getElementById('nvName').value = '';
            } catch(e) { alert("寫入失敗"); }
        } else {
            currentVenue = { name, court, hr, cid: 'temp' };
            document.getElementById('addVenueForm').style.display = 'none';
            document.getElementById('venueAdjustPanel').style.display = 'block';
            document.getElementById('adjustTitle').innerText = name + " (臨時)";
            document.getElementById('fixedVenueActions').style.display = 'none';
            document.getElementById('adjustContent').style.display = 'block'; 
            updateStepperDisplay();
        }
    }

    async function updateFixedVenue() {
        if(!currentVenue.id) return;
        try { await updateDoc(doc(db, "schedules", currentVenue.id), { court: currentVenue.court, hr: currentVenue.hr }); alert("雲端班表已更新！"); } catch(e) { alert("更新失敗"); }
    }

    async function deleteFixedVenue() {
        if(!currentVenue.id || !confirm(`⚠️ 確定要從雲端移除【${currentVenue.name}】的班表嗎？`)) return;
        try { await deleteDoc(doc(db, "schedules", currentVenue.id)); } catch(e) { alert("刪除失敗"); }
    }

    function toggleBallEdit() { isBallEditMode = !isBallEditMode; renderBalls(); }
    function renderBalls() {
        const container = document.getElementById('ballArea'); container.innerHTML = '';
        balls.forEach((b) => {
            const btn = document.createElement('div');
            btn.className = 'ball-btn'; btn.innerText = `${b.name} $${b.price}`;
            if(isBallEditMode) {
                const delIcon = document.createElement('div'); delIcon.className = 'ball-del-btn'; delIcon.innerText = '×';
                delIcon.onclick = (e) => { e.stopPropagation(); deleteBall(b.id); }; btn.appendChild(delIcon); btn.style.borderColor = 'var(--neon-red)';
            } else { btn.onclick = () => selectBall(b, btn); }
            container.appendChild(btn);
        });
        const addBtn = document.createElement('div'); addBtn.className = 'ball-btn'; addBtn.style.border = '1px dashed #94a3b8'; addBtn.innerText = '＋ 新增';
        addBtn.onclick = addNewBall; container.appendChild(addBtn);
    }
    
    async function addNewBall() {
        const name = prompt("名稱:"); if(!name) return;
        const price = prompt("單價:"); if(!price) return;
        try { await addDoc(collection(db, "balls"), { name, price: parseFloat(price) }); } catch(e) { alert("新增失敗"); }
    }
    
    async function deleteBall(id) { if(!confirm("從雲端刪除此球種？")) return; try { await deleteDoc(doc(db, "balls", id)); } catch(e){ alert("刪除失敗"); } }
    
    function selectBall(b, el) { selectedBall = b; document.querySelectorAll('.ball-btn').forEach(btn => btn.classList.remove('active')); el.classList.add('active'); }
    
    function adjVal(id, n) { 
        const el = document.getElementById(id); 
        el.value = Math.max(0, (parseInt(el.value)||0) + n); 
    }

    async function saveRecord() {
        if (!currentVenue) return alert("❌ 請選擇場地");
        if (!selectedBall) return alert("❌ 請選擇球種");
        
        const dateVal = document.getElementById('pickerDate').value;
        const count = parseFloat(document.getElementById('inpCount').value) || 0; 
        const restockTube = parseFloat(document.getElementById('inpRestockTube').value) || 0; 
        const restockBalls = restockTube * 12; 
        
        const cost = selectedBall.price * count;
        const fh = currentVenue.court * currentVenue.hr;
        const dayIdx = new Date(dateVal).getDay();

        const existingRec = records.find(r => r.date === dateVal && r.vName === currentVenue.name);
        
        const recordData = {
            date: dateVal, vName: currentVenue.name, dayIdx,
            fh, bName: selectedBall.name, 
            count, cost, 
            restock: restockBalls, 
            timestamp: Date.now()
        };

        try {
            if (existingRec) {
                if (confirm(`⚠️ 警告：\n${dateVal} 的【${currentVenue.name}】已經有一筆紀錄了！\n\n要「覆蓋」掉原本的資料嗎？`)) {
                    await updateDoc(doc(db, "records", existingRec.id), recordData);
                    alert("✅ 資料已覆蓋更新");
                } else {
                    return; 
                }
            } else {
                await addDoc(collection(db, "records"), recordData);
                alert("✅ 已上傳");
            }
            document.getElementById('inpRestockTube').value = 0;
        } catch(e) { alert("上傳失敗: " + e.message); }
    }

    function copyToClipboard() {
        if (!currentVenue || !selectedBall) return alert("❌ 請先選擇場地與球種");
        const dateVal = document.getElementById('pickerDate').value;
        const count = parseFloat(document.getElementById('inpCount').value) || 0;
        const restockTube = parseFloat(document.getElementById('inpRestockTube').value) || 0;
        
        const totalCost = Math.round(selectedBall.price * count);
        const totalFH = (currentVenue.court * currentVenue.hr);
        const cpch = totalFH > 0 ? (count / totalFH).toFixed(2) : "0.00";
        
        const previousStock = venueLastStock[currentVenue.name] || 0;
        const estimatedStock = previousStock + (restockTube * 12) - count;
        
        const text = `
🚀 曜日羽球｜${currentVenue.name}
📅 日期：${dateVal}
-------------------
🏟 場地：${currentVenue.court} 面 / ${currentVenue.hr} 小時
🏸 耗球：${count} 顆
➕ 補給：${restockTube} 桶
📦 結餘：${estimatedStock} 顆
💰 總金：$${totalCost}
📊 CPCH：${cpch}
-------------------
星際補給母艦 結算完畢
`.trim();

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => { alert("✅ 已複製"); }).catch(err => alert("複製失敗"));
        } else {
            const textArea = document.createElement("textarea"); textArea.value = text; document.body.appendChild(textArea);
            textArea.select(); document.execCommand("copy"); document.body.removeChild(textArea); alert("✅ 已複製");
        }
    }

    function refreshUI() {
        let tCost=0, tBall=0, tFH=0;
        const grouped = {};
        const brandStats = {}; 
        venueLastStock = {}; 

        records.forEach(r => {
            tCost += r.cost; tBall += r.count; tFH += r.fh;
            
            // 品牌累積
            if(!brandStats[r.bName]) brandStats[r.bName] = { count: 0, fh: 0 };
            brandStats[r.bName].count += r.count;
            brandStats[r.bName].fh += r.fh;

            if(!grouped[r.vName]) {
                grouped[r.vName] = { list: [], total: 0, dayIdx: r.dayIdx, currentStock: 0, monthly: {} };
            }
            
            grouped[r.vName].currentStock += (r.restock || 0) - r.count;
            r.snapshotStock = grouped[r.vName].currentStock;
            venueLastStock[r.vName] = grouped[r.vName].currentStock;

            grouped[r.vName].list.push(r);
            grouped[r.vName].total += r.cost;

            const mKey = r.date.slice(0, 7); 
            if(!grouped[r.vName].monthly[mKey]) grouped[r.vName].monthly[mKey] = { count: 0, cost: 0, fh: 0, endStock: 0 };
            grouped[r.vName].monthly[mKey].count += r.count;
            grouped[r.vName].monthly[mKey].cost += r.cost;
            grouped[r.vName].monthly[mKey].fh += r.fh;
            grouped[r.vName].monthly[mKey].endStock = grouped[r.vName].currentStock;
        });

        // 渲染品牌軍火條
        const brandBar = document.getElementById('brandBar');
        brandBar.innerHTML = Object.keys(brandStats).map(b => {
            const d = brandStats[b];
            const cpch = d.fh > 0 ? (d.count / d.fh).toFixed(2) : "0.00";
            const alertClass = parseFloat(cpch) > 4.0 ? "cpch-alert" : "";
            return `<div class="brand-tag">${b} <span class="${alertClass}">${cpch}</span></div>`;
        }).join('');

        const container = document.getElementById('historyContainer'); container.innerHTML = '';
        
        Object.keys(grouped).forEach(vName => {
            const g = grouped[vName];
            const cls = g.dayIdx !== undefined ? `day-${g.dayIdx}` : 'day-temp';
            const reversedList = [...g.list].reverse();

            let monthHtml = '';
            Object.keys(g.monthly).sort().reverse().forEach(m => {
                const md = g.monthly[m];
                const m_avg = md.fh > 0 ? Math.round(md.cost / md.fh) : 0;
                
                let stockClass = '';
                if(md.endStock >= 24) stockClass = 'stock-safe';
                else if(md.endStock >= 12) stockClass = 'stock-warn';
                else stockClass = 'stock-crit';

                monthHtml += `
                    <div class="month-card">
                        <div class="mc-header">${m}</div>
                        <div class="mc-row"><span class="mc-label">耗球</span><span class="mc-val" style="color:var(--accent)">${md.count}</span></div>
                        <div class="mc-row"><span class="mc-label">開銷</span><span class="mc-val">$${md.cost}</span></div>
                        <div class="mc-row"><span class="mc-label">均/hr</span><span class="mc-val">$${m_avg}</span></div>
                        <div class="mc-stock-box">
                            <div class="mc-stock-label">庫存</div>
                            <div class="mc-stock-num ${stockClass}">
                                ${md.endStock}
                                <span class="mc-stock-unit">顆</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            const html = `
                <div class="venue-group ${cls}">
                    <div class="group-header"><span class="gh-title">${vName}</span><span>$${Math.round(g.total).toLocaleString()}</span></div>
                    <div class="month-dashboard">${monthHtml}</div>
                    <table>
                        <thead><tr><th>日期</th><th>耗損/補給</th><th>健康度</th><th>$/FH</th><th>刪</th></tr></thead>
                        <tbody>
                            ${reversedList.map(i => {
                                const cpch = i.fh > 0 ? (i.count/i.fh).toFixed(2) : 0;
                                const costPerFH = i.fh > 0 ? Math.round(i.cost / i.fh) : 0;
                                
                                let badgeClass = ''; let labelText = ''; let numColor = '';
                                if(cpch <= 2.5) { badgeClass = 'st-green'; labelText = '極省'; numColor = 'var(--st-green-text)'; }
                                else if(cpch <= 4.0) { badgeClass = 'st-yellow'; labelText = '正常'; numColor = 'var(--st-yellow-text)'; }
                                else { badgeClass = 'st-red'; labelText = '高損'; numColor = 'var(--st-red-text)'; }
                                
                                const badgeHtml = `<span class="badge-combined ${badgeClass}">${labelText} <span style="opacity:0.3;">|</span> <span style="color:${numColor}">${cpch}</span></span>`;
                                
                                let stockDisplay = `<div style="font-size:0.9rem; font-weight:bold;">
                                    <span style="color:#f87171;">-${i.count}</span>`;
                                if(i.restock > 0) {
                                    stockDisplay += ` <span style="color:#34d399; margin-left:5px;">+${i.restock}</span>`;
                                }
                                stockDisplay += `</div>`;

                                return `<tr>
                                    <td>${i.date.slice(5)}</td>
                                    <td>${stockDisplay}</td>
                                    <td>${badgeHtml}</td>
                                    <td style="color:var(--text-secondary);">$${costPerFH}</td>
                                    <td><button class="btn-del-row" onclick="delRecord('${i.id}')">×</button></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>`;
            container.innerHTML += html;
        });

        document.getElementById('footCost').innerText = "$"+Math.round(tCost).toLocaleString();
        document.getElementById('footBall').innerText = tBall;
        document.getElementById('footCPCH').innerText = tFH>0 ? (tBall/tFH).toFixed(2) : "0.0";
        document.getElementById('footAvgCost').innerText = "$" + (tFH>0 ? Math.round(tCost/tFH) : 0);
    }

    async function delRecord(id){ if(confirm("確定刪除此筆紀錄？")){ try { await deleteDoc(doc(db, "records", id)); } catch(e){ alert("刪除失敗"); } } }
    
    async function clearData(){ 
        const pwd = prompt("☢️ 核彈發射程序啟動 ☢️\n\n警告：這將從雲端永久清除所有歷史資料！\n\n請輸入艦長授權密碼：");
        if (pwd === "681101") {
            if(confirm("⚠️ 再次確認：真的要清空嗎？")) {
                alert("開始清空，請稍候...");
                for(let r of records) { await deleteDoc(doc(db, "records", r.id)); }
                alert("💥 雲端資料已清空");
            }
        } else if (pwd !== null) { alert("❌ 授權密碼錯誤！存取被拒"); }
    }
    
    function exportData() {
        if(records.length===0) return alert("目前無資料可匯出");
        
        const pwd = prompt("🔒 請輸入艦長授權密碼以匯出報表：");
        if (pwd !== "681101") {
            return alert("❌ 密碼錯誤！無法匯出");
        }

        let csv = "\uFEFF日期,場地,球種,場時,耗球,補給(顆),庫存(顆),總金額,CPCH,每場時成本($/FH),狀態\n";
        records.forEach(r => {
            const cpch = r.fh>0 ? (r.count/r.fh).toFixed(2) : 0;
            const costPerFH = r.fh>0 ? Math.round(r.cost/r.fh) : 0;
            let st = cpch > 4 ? "過載" : (cpch >= 2.5 ? "正常" : "極省");
            csv += `${r.date},${r.vName},${r.bName},${r.fh},${r.count},${r.restock||0},${r.snapshotStock||0},${r.cost},${cpch},${costPerFH},${st}\n`;
        });
        const url = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
        const a = document.createElement('a'); a.href=url; a.download=`曜日報表_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    }

    async function initDefaultData() {
        if(!confirm("確定要寫入預設班表和球種嗎？")) return;
        const defaultScheds = [
            { dayIndex: 1, name: '月曜南港', court: 2, hr: 2 }, { dayIndex: 1, name: '月曜中壢', court: 4, hr: 2 },
            { dayIndex: 2, name: '火曜太平', court: 3, hr: 2 },
            { dayIndex: 3, name: '水曜七七', court: 3, hr: 2 }, { dayIndex: 3, name: '水曜二重', court: 4, hr: 2 },
            { dayIndex: 4, name: '木曜大同', court: 4, hr: 2 },
            { dayIndex: 6, name: '土曜興雅', court: 11, hr: 2 },
            { dayIndex: 0, name: '日曜中正', court: 2, hr: 2 }
        ];
        const defaultBalls = [ { name: '黑魔亞', price: 67 }, { name: '藍蓋', price: 75 }, { name: 'Master', price: 92 } ];
        try {
            for(let s of defaultScheds) await addDoc(collection(db, "schedules"), s);
            for(let b of defaultBalls) await addDoc(collection(db, "balls"), b);
            alert("✅ 初始化完成！");
        } catch(e) { console.error(e); alert("初始化失敗"); }
    }

    const lastDate = localStorage.getItem('yao_last_date');
    document.getElementById('pickerDate').value = lastDate || new Date().toISOString().split('T')[0];
    handleDateChange();
</script>
