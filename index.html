<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>曜日羽球團 - 星際補給母艦 v4.3</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        /* --- 1. 核心變數 --- */
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --bg-input: #334155;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --accent: #38bdf8; --border: #475569;
            --d-1: #a855f7; --d-2: #ef4444; --d-3: #3b82f6; --d-4: #22c55e;
            --d-5: #f59e0b; --d-6: #f97316; --d-0: #eab308; --d-temp: #94a3b8;
            --neon-red: #ff1744; --neon-red-glow: rgba(255, 23, 68, 0.35); --neon-red-bg: rgba(255, 23, 68, 0.1);
            --st-green-bg: rgba(16, 185, 129, 0.15); --st-green-text: #34d399; 
            --st-yellow-bg: rgba(245, 158, 11, 0.15); --st-yellow-text: #fbbf24;
            --st-red-bg: rgba(239, 68, 68, 0.15);    --st-red-text: #f87171;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main); color: var(--text-primary);
            margin: 0; padding: 10px; padding-bottom: 140px; 
        }

        /* --- 2. 登入介面 --- */
        #authOverlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.98); z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .login-card {
            background: var(--bg-card); padding: 40px 30px; border-radius: 20px;
            border: 1px solid var(--border); box-shadow: 0 0 50px rgba(56, 189, 248, 0.15);
            text-align: center; max-width: 320px; width: 85%;
        }
        .btn-google {
            background: white; color: #1e293b; font-weight: bold; border: none;
            padding: 14px 24px; border-radius: 50px; font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
            margin-top: 25px; transition: transform 0.2s;
        }
        .btn-google:active { transform: scale(0.96); }
        
        /* --- 3. 頂部標題列 & 使用者資訊 (響應式配置) --- */
        .header-container {
            display: flex;
            flex-direction: column; /* 手機版：垂直排列 */
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 15px;
            padding-top: 10px;
        }

        h1 { 
            text-align: center; font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; color: var(--text-primary); 
            margin: 0; /* 移除預設邊距 */
            /* 手機版：標題往下移一點，避免被上方資訊列擋住 */
            padding-top: 40px; 
        }
        h1 span { color: var(--accent); text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        /* 版本號字體變小 */
        .version-tag { font-size: 0.8rem; opacity: 0.8; }

        /* 使用者資訊列：絕對定位在右上角 */
        .user-info { 
            position: absolute; top: 0; right: 0;
            font-size: 0.8rem; color: var(--accent); 
            display: flex; align-items: center; gap: 8px; cursor: pointer; z-index: 100;
            background: rgba(0,0,0,0.4); padding: 4px 8px 4px 12px; border-radius: 50px; border: 1px solid var(--border);
            backdrop-filter: blur(5px);
        }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }

        /* 電腦版 (寬度大於 768px)：水平排列，資訊列放回正常位置 */
        @media (min-width: 768px) {
            .header-container {
                flex-direction: row; /* 改為水平排列 */
                justify-content: space-between;
                align-items: center;
                padding-top: 0;
            }
            h1 { 
                padding-top: 0; /* 移除手機版的 padding */
                text-align: left; /* 標題靠左 */
                font-size: 1.6rem; /* 電腦版標題稍微大一點 */
            }
            /* 資訊列不再絕對定位，回到正常的排版流中 */
            .user-info {
                position: static; 
                background: rgba(0,0,0,0.2);
                padding: 6px 12px 6px 16px;
            }
            .user-avatar { width: 32px; height: 32px; }
        }

        /* --- 4. 響應式佈局 --- */
        .dashboard-container { display: flex; flex-direction: column; gap: 15px; max-width: 1200px; margin: 0 auto; }
        
        @media (min-width: 768px) {
            .dashboard-container {
                display: grid; grid-template-columns: 1fr 1fr;
                grid-template-areas: "venue ball" "history history";
                align-items: start; gap: 24px; padding-top: 20px; max-width: 960px;
            }
            .area-venue { grid-area: venue; } .area-ball { grid-area: ball; } .area-history { grid-area: history; }
            
            body { 
                background-color: #0b1120; 
                background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1120 60%); 
                min-height: 100vh; margin:0; padding: 20px; 
                padding-bottom: 250px !important; 
            }
            .card { border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
            
            .summary-bar { 
                width: auto !important; min-width: 640px; padding: 10px 25px !important; 
                left: 50% !important; bottom: 40px !important; transform: translateX(-50%); 
                border-radius: 20px !important; background: rgba(15, 23, 42, 0.9) !important; backdrop-filter: blur(12px);
                border: 1px solid rgba(255,255,255,0.1) !important;
                display: flex !important; flex-direction: column; gap: 8px; 
                box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            }
            .hud-row-main { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; }
            .hud-item { flex-direction: row; gap: 10px; align-items: baseline; }
            .label { font-size: 0.8rem; margin-bottom: 0; opacity: 0.8; } .val { font-size: 1.3rem; }
            
            table tr:hover td { background: rgba(255,255,255,0.05); }
            .venue-btn:hover, .ball-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

            /* 電腦版表格優化 */
            table th:nth-child(1) { width: 80px !important; }
            table th:nth-child(2) { width: auto !important; }
            table th:nth-child(3) { width: 22% !important; }
            table th:nth-child(4) { width: 15% !important; }
            table th:nth-child(5) { width: 50px !important; }
        }

        /* --- 5. 元件樣式 --- */
        .card { background: var(--bg-card); border-radius: 14px; padding: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { font-size: 1rem; margin: 0 0 12px 0; color: var(--text-secondary); font-weight: 600; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        input { transition: 0.2s; border-radius: 8px; } input:focus { border-color: var(--accent); outline: none; }
        
        input[type="date"] { 
            width: 100%; max-width: 260px; padding: 10px; 
            background: var(--bg-input); border: 1px solid var(--border); 
            color: white; font-size: 1rem; font-weight: bold; 
            display: block; margin: 0 auto; text-align: center; border-radius: 50px; 
        }

        .venue-grid, .ball-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .venue-btn, .ball-btn { background: var(--bg-main); border: 1px solid var(--border); padding: 12px 4px; border-radius: 10px; cursor: pointer; text-align: center; color: var(--text-secondary); transition: all 0.2s; position: relative; overflow: hidden; }
        .venue-btn { border-left-width: 4px; }
        .venue-btn strong { display: block; font-size: 0.95rem; margin-bottom: 3px; color: var(--text-primary); }
        .venue-btn span { font-size: 0.7rem; opacity: 0.7; }
        .venue-btn.active { background: var(--bg-input); box-shadow: inset 0 0 15px rgba(0,0,0,0.5); border-color: var(--accent); } .venue-btn.active strong { color: var(--accent); }
        .ball-btn.active { background: var(--bg-input); color: var(--accent); border-color: var(--accent); }
        .ball-del-btn { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; background: var(--neon-red); color: white; border-radius: 50%; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; z-index: 2; border: 2px solid var(--bg-card); }

        .day-1 { border-left-color: var(--d-1); } .day-1.active { border-color: var(--d-1); color: var(--d-1); }
        .day-2 { border-left-color: var(--d-2); } .day-2.active { border-color: var(--d-2); color: var(--d-2); }
        .day-3 { border-left-color: var(--d-3); } .day-3.active { border-color: var(--d-3); color: var(--d-3); }
        .day-4 { border-left-color: var(--d-4); } .day-4.active { border-color: var(--d-4); color: var(--d-4); }
        .day-5 { border-left-color: var(--d-5); } .day-5.active { border-color: var(--d-5); color: var(--d-5); }
        .day-6 { border-left-color: var(--d-6); } .day-6.active { border-color: var(--d-6); color: var(--d-6); }
        .day-0 { border-left-color: var(--d-0); } .day-0.active { border-color: var(--d-0); color: var(--d-0); }
        .day-temp { border-left-color: var(--d-temp); }

        #venueAdjustPanel, #addVenueForm { margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px solid var(--border); display: none; }
        #addVenueForm { background: var(--bg-input); }
        .adjust-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .adjust-title { font-weight: bold; color: var(--accent); font-size: 1rem; }
        .btn-toggle-edit { background: transparent; border: 1px solid var(--text-secondary); color: var(--text-secondary); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .btn-toggle-edit.active { background: var(--bg-input); color: var(--accent); border-color: var(--accent); }
        #adjustContent { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
        .adjust-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9rem; }
        .stepper-group { display: flex; align-items: center; gap: 6px; background: var(--bg-input); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
        .step-btn { width: 32px; height: 32px; background: var(--bg-card); border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 1.1rem; }
        .step-btn:active { background: var(--accent); color: var(--bg-main); }
        .step-val { width: 50px; text-align: center; font-size: 1rem; font-weight: bold; font-family: monospace; color: var(--accent); }
        
        .stock-panel { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .stock-row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; padding: 6px; border-radius: 8px; background: rgba(255,255,255,0.03); }
        .stock-row.main { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); } 
        .stock-label-multi { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; font-size: 0.8rem; color: var(--text-secondary); text-align: right; padding-right: 4px; font-weight: bold; line-height: 1.1; }
        .stock-label { font-size: 0.8rem; color: var(--text-secondary); text-align: right; padding-right: 4px; font-weight: bold; }
        .num-control { display: flex; align-items: center; gap: 4px; width: 100%; }
        .num-btn { width: 36px; height: 36px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num-btn:active { background: var(--accent); color: var(--bg-main); }
